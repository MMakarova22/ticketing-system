<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 1.5 21 21">
  <!-- Ticket Tracker favicon: a ticket stub holding a tiny three-column board. Same geometry as BrandMark
       (apps/web/src/components/icons.tsx); the colors are the accent and on-accent tokens of each theme
